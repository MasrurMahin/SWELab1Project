<!DOCTYPE html>
<html>

<head>
  <title>Task Board</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: sans-serif; max-width: 700px; margin: 2em auto;
      background: var(--bg, #fff); color: var(--fg, #000);
    }
    .task { padding: 8px; border: 1px solid #ccc; margin: 4px 0; display: flex; justify-content: space-between; }
    .done { text-decoration: line-through; opacity: 0.6; }
    body.dark { --bg: #1e1e1e; --fg: #e0e0e0; }
    body.dark .task { border-color: #555; }
  </style>
</head>

<body>
<h1>Task Board</h1>
  <button onclick="toggleDark()">🌙 Toggle dark mode</button>
  <input id="title" placeholder="Task title" />
  <input id="assignee" placeholder="Assignee" />
  <button onclick="addTask()">Add</button>

  <div style="margin-top: 1em;">
    <label>Filter by assignee: </label>
    <select id="filter" onchange="load()">
      <option value="">All</option>
    </select>
  </div>

  <div id="list"></div>

  <script>let allTasks = [];
    async function load() {
      const res = await fetch('/api/tasks');
      allTasks = await res.json();

      // populate dropdown with unique assignees
      const filter = document.getElementById('filter');
      const current = filter.value;
      const names = [...new Set(allTasks.map(t => t.assignee).filter(Boolean))];
      filter.innerHTML = '<option value="">All</option>' +
        names.map(n => `<option value="${n}">${n}</option>`).join('');
      filter.value = current;

      const tasks = current ? allTasks.filter(t => t.assignee === current) : allTasks;
      document.getElementById('list').innerHTML = tasks.map(t => `
        <div class="task ${t.status === 'done' ? 'done' : ''}">
          <span>${t.title} — ${t.assignee || 'unassigned'}</span>
          <span>
            <button onclick="toggle(${t.id}, '${t.status}')">${t.status === 'done' ? '↺' : '✓'}</button>
            <button onclick="del(${t.id})">🗑</button>
          </span>
        </div>
      `).join('');
    }
    async function addTask() {
      const title = document.getElementById('title').value;
      const assignee = document.getElementById('assignee').value;
      if (!title) return;
      await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, assignee }) });
      load();
    }
    async function toggle(id, status) {
      await fetch('/api/tasks/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: status === 'done' ? 'todo' : 'done' }) });
      load();
    }
    async function del(id) {
      await fetch('/api/tasks/' + id, { method: 'DELETE' });
      load();
    }
    load();
    function toggleDark() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>

</html>
